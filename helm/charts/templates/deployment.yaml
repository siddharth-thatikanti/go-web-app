apiVersion: apps/v1
kind: Deployment

metadata:
  name: go-webapp
  labels:
    app: go-web-app

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: go-web-app

  template:
    metadata:
      labels:
        app: go-web-app

    spec:
      containers:
        - name: go-web-app-container

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP